name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false   # when it breaks, the interesting question is which platforms broke (SE1/O3)
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]   # the oldest dm.py supports, and the newest
    runs-on: ${{ matrix.os }}
    env:
      SE_GUIDE: .se1   # the SE1 guide: its README for the checker's SE1 IDs, its se.py for the doctor
    steps:
      # Full history: the checker reads this guide's own tags once there are any (a copy's label,
      # a patch release's minor).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The SE1 guide at the release this guide is pinned to (SE_RELEASE in tools/check.js), so every
      # SE1 ID this guide cites is checked to exist in that release, not in whatever main says now.
      - uses: actions/checkout@v7
        with:
          repository: wmacevoy/software-engineering
          ref: v1.3
          fetch-depth: 0
          path: .se1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The same commands a contributor runs locally (SE1/O3); no dependencies to install.
      - run: node tools/check.js
      - run: python -I tools/test_dm.py
      - run: python dm.py --version
      - if: runner.os != 'Windows'
        run: ./dm --version
      - shell: pwsh
        run: ./dm.ps1 --version
